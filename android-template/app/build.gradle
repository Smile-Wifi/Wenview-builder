apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.htmltoapk.builder"
    compileSdk 34

    defaultConfig {
        applicationId "com.htmltoapk.builder"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
            def keystoreFile = file("release.jks")

            if (keystoreBase64 != null && !keystoreBase64.isEmpty()) {
                byte[] decoded = keystoreBase64.decodeBase64()
                keystoreFile.setBytes(decoded)
            }

            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASS") ?: "android"
                keyAlias System.getenv("KEY_ALIAS") ?: "myapp"
                keyPassword System.getenv("KEY_PASS") ?: (System.getenv("KEYSTORE_PASS") ?: "android")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Optional AdMob dependency injected when enabled:
    // implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
