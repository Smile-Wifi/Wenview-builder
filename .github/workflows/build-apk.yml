name: Build APK
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Unique build Job ID'
        required: true
      configUrl:
        description: 'URL or payload containing app configuration JSON'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Template with Assets
        run: |
          npm ci
          npx tsx scripts/prepare-template.ts --config="${{ inputs.configUrl }}" --jobId="${{ inputs.jobId }}"

      - name: Build APK & AAB with Gradle
        working-directory: android-template
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign & Align APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'key0' }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED_APK="android-template/app/build/outputs/apk/release/app-release-unsigned.apk"
          
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="android-template/app/build/outputs/apk/release/app-release.apk"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEYSTORE_PASS" --out app-release-signed.apk "$UNSIGNED_APK"
          else
            # Debug/Self-signed fallback keystore
            keytool -genkey -v -keystore release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Android,O=APKBuilder,C=US"
            $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEYSTORE_PASS" --out app-release-signed.apk "$UNSIGNED_APK"
          fi

          $BUILD_TOOLS/zipalign -v -p 4 app-release-signed.apk app-release-aligned.apk

      - name: Compute Checksums
        id: checksums
        run: |
          SHA256=$(sha256sum app-release-aligned.apk | awk '{print $1}')
          SIZE=$(stat -c%s app-release-aligned.apk)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.jobId }}
          path: app-release-aligned.apk

      - name: Notify Webhook Callback
        if: always()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="failed"
          fi
          
          if [ -n "$CALLBACK_URL" ]; then
            curl -s -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"jobId\":\"${{ inputs.jobId }}\",\"status\":\"$STATUS\",\"sha256\":\"${{ steps.checksums.outputs.sha256 }}\",\"sizeBytes\":${{ steps.checksums.outputs.size || 0 }}}"
          fi
